<input type="hidden" id="${entry.idEntry?c}_map_provider" name="${entry.idEntry?c}_map_provider" value="${entry.mapProvider.key}"/>
<div class="form-group" id="${entry.idEntry?c}_address_results"></div>
<div class="visually-hidden" id="${entry.idEntry?c}_address_status" role="status" aria-live="polite"></div>
<script type="text/javascript" src="js/plugins/genericattributes/modules/address/genericattributes_address.js"></script>
<script type="text/javascript">
// plain script, without jQuery: the front office theme does not load it
( function( ){
	var buttonCheck = document.getElementById( '${entry.idEntry?c}_button_check' );
	if ( buttonCheck ) {
		buttonCheck.classList.remove( 'hide' );
	}
	var address = document.getElementById( '${entry.idEntry?c}_address' );
	if ( address ) {
		address.addEventListener( 'keydown', function( event ) {
			if ( event.key === 'Enter' ) {
				event.preventDefault( );
				checkAddress( ${entry.idEntry?c} );
			}
		});
	}
})( );
</script>
<noscript>#i18n{module.genericattributes.address.javascript.disabled}</noscript>
